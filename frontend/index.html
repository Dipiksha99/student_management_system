<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>Student Management System</h1>
        <p>Manage student records easily and efficiently</p>
    </header>


    <!-- Main Dashboard -->
    <main class="dashboard">

        <h2 id="dash">Dashboard</h2>


        <!-- Dashboard Cards -->
        <section class="cards">

            <!-- Total Students -->
            <div class="card">
                <h3>Total Students</h3>
                <p id="sc">0</p>
            </div>


            <!-- Total Courses -->
            <div class="card">
                <h3>Total Courses</h3>
                <p id="cc">00</p>
            </div>


            <!-- Active Students -->
            <div class="card">
                <h3>Active Students</h3>
                <p id="ac">0</p>
            </div>

        </section>


        <!-- Dashboard Buttons -->
        <section class="buttons">

            <button id="add" type="button">
                Add Student
            </button>

            <button id="view" type="button">
                View Students
            </button>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
